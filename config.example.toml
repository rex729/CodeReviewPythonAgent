# 選填的進階設定。要用的話複製成 config.toml；沒有這個檔案時全部用預設值。
# 要監看哪些 repo 寫在 repos.txt，每輪間隔幾分鐘寫在 review.config。
# 私有 repo 的 token 放在環境變數 GITLAB_TOKEN，不要寫在這裡。

# 存放 clone 下來的專案、狀態檔和報告的資料夾（相對於這個設定檔）
workdir = "workdir"

[gitlab]
# target_branch = "main"        # 只 review 合併到這個 branch 的 MR，不寫則 review 所有開著的 MR
# post_comments = true          # 在 MR 上開 thread 留言（需要 api 權限的 GITLAB_TOKEN）；false 則只寫本機報告

[ollama]
host = "http://localhost:11434"
model = "qwen2.5-coder:7b"
num_ctx = 16384                 # context 大小（token）。qwen2.5-coder 最大 32768，越大越吃 VRAM

[review]
# include_extensions = [".py", ".kt"]      # 只 review 這些副檔名，不寫則用內建清單
# exclude_dirs = ["build", "node_modules"] # 略過這些資料夾，不寫則用內建清單
