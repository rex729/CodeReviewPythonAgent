<svg xmlns="http://www.w3.org/2000/svg" width="800" height="290" viewBox="0 0 800 290"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><style>text{font-family:"PingFang TC","Hiragino Sans",sans-serif;fill:#1F2937}.t{font-size:20px;font-weight:600}.s{font-size:15px;fill:#4B5563}.m{font-family:Menlo,monospace;font-size:13.5px;fill:#374151}.n{font-size:13.5px;fill:#6B7280}.l{stroke:#4B5563;stroke-width:1.8;fill:none}</style></defs>
<rect width="800" height="290" fill="#fff"/>
<text class="t" x="40" y="52" style="font-size:17px">第 1 輪</text>
<text class="n" x="104" y="52">（例如花了 5 分鐘）</text>
<g class="s">
<rect x="40" y="72" width="56" height="48" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/><text class="t" x="68" y="103" text-anchor="middle" style="font-size:17px">A</text>
<rect x="100" y="72" width="56" height="48" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/><text class="t" x="128" y="103" text-anchor="middle" style="font-size:17px">B</text>
<rect x="160" y="72" width="56" height="48" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/><text class="t" x="188" y="103" text-anchor="middle" style="font-size:17px">C</text>
<rect x="220" y="72" width="56" height="48" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/><text class="t" x="248" y="103" text-anchor="middle" style="font-size:17px">D</text>
<rect x="280" y="72" width="56" height="48" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/><text class="t" x="308" y="103" text-anchor="middle" style="font-size:17px">E</text>
</g>
<rect x="352" y="72" width="216" height="48" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 5"/>
<text class="s" x="460" y="102" text-anchor="middle">等 3 分鐘</text>
<text class="t" x="584" y="52" style="font-size:17px">第 2 輪</text>
<rect x="584" y="72" width="56" height="48" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/><text class="t" x="612" y="103" text-anchor="middle" style="font-size:17px">A</text>
<rect x="644" y="72" width="56" height="48" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/><text class="t" x="672" y="103" text-anchor="middle" style="font-size:17px">B</text>
<text class="t" x="730" y="103" text-anchor="middle" style="font-size:17px;fill:#6B7280">…</text>
<path class="l" d="M40,140 H760" marker-end="url(#a)"/>
<text class="n" x="764" y="160" text-anchor="end">時間</text>
<path d="M346,128 V182 M578,128 V182" stroke="#4B5563" stroke-width="1.5"/>
<text class="n" x="346" y="202" text-anchor="middle">整輪跑完才讀 review.config</text>
<text class="n" x="346" y="222" text-anchor="middle">開始計時</text>
<text class="n" x="578" y="202" text-anchor="middle">重新讀 repos.txt</text>
<text class="n" x="578" y="222" text-anchor="middle">（新增的 repo 這輪就生效）</text>
<text class="s" x="400" y="268" text-anchor="middle">等待從上一輪結束後才開始，所以兩輪永遠不會重疊或堆積</text>
</svg>
